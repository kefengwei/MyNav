<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyNav · 我的导航</title>
<meta name="description" content="个人网络收藏导航站，纯静态，零依赖。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090a0f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 在首次绘制前应用已保存的主题，避免闪白/闪黑 */
(function () {
  try {
    var t = localStorage.getItem('mynav:theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* 隐私模式下忽略 */ }
})();
</script>
<script src="data/links.js" defer></script>
<script src="assets/app.js" defer></script>
</head>
<body>

<canvas id="bgfx" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <img class="brand-mark" src="assets/logo.png" alt="" width="30" height="30">
      <span class="brand-text">
        <strong id="site-title">MyNav</strong>
        <small id="site-subtitle">我的网络收藏</small>
      </span>
    </a>

    <div class="search" id="search-box">
      <button id="scope-btn" class="scope-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="切换搜索范围" title="切换搜索范围">
        <span id="scope-icon" aria-hidden="true">🔍</span>
        <svg class="scope-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <ul id="scope-menu" class="scope-menu" role="menu" hidden>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="true" data-scope="site">🔍 站内搜索</button></li>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-scope="google">🌐 Google</button></li>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-scope="bing">🔎 Bing</button></li>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-scope="baidu">🐾 百度</button></li>
      </ul>
      <input id="search" type="search" placeholder="搜索名称、网址、标签…" autocomplete="off" spellcheck="false" aria-label="搜索链接" title="回车打开第一个结果；Ctrl/⌘+K 打开快速搜索">
      <kbd class="search-kbd">/</kbd>
      <button id="search-go" class="search-go" type="button" aria-label="打开搜索结果" title="打开第一个结果">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
      </button>
    </div>

    <a class="btn-admin" href="admin.html" title="管理链接数据" aria-label="管理链接数据">
      <span class="ico" aria-hidden="true">⚙️</span>
      <span class="txt">管理</span>
    </a>

    <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题" title="切换主题">
      <span class="theme-auto">🌗</span>
      <span class="theme-light">☀️</span>
      <span class="theme-dark">🌙</span>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="分类导航">
    <div class="catnav-bar" id="catnav-bar" hidden>
      <div class="sidebar-head">分类</div>
      <nav id="catnav" class="catnav" aria-label="分类导航" tabindex="0"></nav>
      <button class="catnav-arrow is-prev" id="catnav-prev" type="button" aria-label="向左查看更多分类" hidden>‹</button>
      <button class="catnav-arrow is-next" id="catnav-next" type="button" aria-label="向右查看更多分类" hidden>›</button>
    </div>
  </aside>

  <div class="main-col">
    <main id="content" class="content">
      <p class="loading">正在加载数据…</p>
    </main>

    <section id="fav-section" class="fav-section" aria-label="收藏夹" hidden>
      <div class="fav-head">
        <h2 class="fav-title"><svg class="cat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/></svg>收藏夹</h2>
        <span class="fav-total" id="fav-total"></span>
      </div>
      <div id="fav-groups" class="fav-groups"></div>
    </section>

    <div id="empty" class="empty" hidden>
      <p class="empty-emoji">🔍</p>
      <p class="empty-title">没有匹配的链接</p>
      <p class="empty-hint">换个关键词试试，或用 <kbd>Esc</kbd> 清空搜索。</p>
    </div>
  </div>
</div>

<footer class="footer">
  <span id="footer-meta"></span>
  <span class="dot">·</span>
  <a href="admin.html">管理</a>
  <span class="dot">·</span>
  <a href="https://github.com/kefengwei/MyNav" target="_blank" rel="noopener">GitHub</a>
</footer>


<!-- Ctrl/⌘ + K 快速搜索面板 -->
<div id="cmdk" class="cmdk" hidden aria-hidden="true">
  <div class="cmdk-backdrop" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="快速搜索">
    <div class="cmdk-head">
      <svg class="cmdk-head-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
      <input id="cmdk-input" type="text" placeholder="输入关键词… 支持模糊匹配与域名" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="cmdk-list" aria-autocomplete="list">
      <kbd class="cmdk-esc">Esc</kbd>
    </div>
    <ul id="cmdk-list" class="cmdk-list" role="listbox" aria-label="搜索结果"></ul>
    <div id="cmdk-empty" class="cmdk-empty" hidden>没有匹配的链接，换个词试试</div>
    <div class="cmdk-foot">
      <span class="cmdk-hints"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>↵</kbd> 打开 <kbd>Esc</kbd> 关闭</span>
      <span class="cmdk-count" id="cmdk-count"></span>
    </div>
  </div>
</div>

<noscript>
  <p style="padding:24px;text-align:center">本站需要启用 JavaScript 才能显示导航内容。</p>
</noscript>

</body>
</html>
